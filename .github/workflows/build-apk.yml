name: Build Hisably APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper files
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate wrapper jar if missing
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cd android && gradle wrapper --gradle-version 9.3.1 --distribution-type all
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hisably-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
